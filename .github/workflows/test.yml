name: Tests
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore project deps
        run: npm ci

      - name: Test
        run: npm run test
